services:
  postgres:
    image: postgres:18-alpine
    container_name: adwebapp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-adwebapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-adwebapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adwebapp-network
    volumes:
      - postgres-data-dev:/var/lib/postgresql

networks:
  adwebapp-network:
    driver: bridge

volumes:
  postgres-data-dev:
