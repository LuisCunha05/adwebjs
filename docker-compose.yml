services:
  adwebapp:
    container_name: adwebapp
    build:
      context: ./
      target: runner
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - adwebapp-data:/app/data
    networks:
      - adwebapp-network

  db-migrate:
    container_name: adwebapp-migrate
    build:
      context: ./
      target: builder
    command: >
      sh -c "
        if [ -d src/infrastructure/prisma/migrations ] && [ -n \"\$(ls -A src/infrastructure/prisma/migrations 2>/dev/null)\" ]; then
          pnpm exec prisma migrate deploy --schema src/infrastructure/prisma/schema.prisma;
        else
          pnpm exec prisma db push --schema src/infrastructure/prisma/schema.prisma;
        fi
      "
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adwebapp-network

  postgres:
    image: postgres:18-alpine
    container_name: adwebapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-adwebapp}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-adwebapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adwebapp-network
    volumes:
      - postgres-data:/var/lib/postgresql

networks:
  adwebapp-network:
    driver: bridge

volumes:
  postgres-data:
  adwebapp-data:
